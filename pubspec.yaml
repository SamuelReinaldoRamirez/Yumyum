name: yummap
description: "La carte aux trésors du Paris culinaire."
version: 3.1.0  # Changement de la version ici
environment:
  sdk: '>=3.2.6 <4.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/splash.png
    - assets/custom_map.json
    - assets/i18n/ # Dossier contenant les fichiers de traduction
    - assets/yummap-bicolor.png
    - assets/logo/logo_new.png
    - assets/illustrations/Baker-pana.svg

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins/Poppins-BoldItalic.ttf
    - family: Sifonn
      fonts:
        - asset: assets/fonts/sifonn/SIFONN_PRO.otf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/Playfair_Display/static/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/Playfair_Display/static/PlayfairDisplay-Bold.ttf
        - asset: assets/fonts/Playfair_Display/static/PlayfairDisplay-Italic.ttf
        - asset: assets/fonts/Playfair_Display/static/PlayfairDisplay-BoldItalic.ttf
    - family: SourceSansPro
      fonts:
        - asset: assets/fonts/Source_Sans_3/static/SourceSans3-Regular.ttf
        - asset: assets/fonts/Source_Sans_3/static/SourceSans3-Bold.ttf
        - asset: assets/fonts/Source_Sans_3/static/SourceSans3-Italic.ttf
        - asset: assets/fonts/Source_Sans_3/static/SourceSans3-BoldItalic.ttf

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.0.6
  flutter_map: ^4.0.0
  latlng: any
  http: ^0.13.3
  app_tracking_transparency: ^2.0.4
  latlong2: ^0.8.2
  flutter_map_marker_cluster: ^1.1.1
  chewie: ^1.2.2
  video_player: ^2.4.2
  geolocator: ^13.0.2
  logger: ^2.0.2+1
  glassmorphism: ^3.0.0
  url_launcher: ^6.2.5
  flutter_native_splash: any
  cupertino_icons: ^1.0.2
  flutter_rating_bar: ^4.0.0
  flutter_inappwebview: ^6.0.0
  mixpanel_flutter: ^2.2.0
  flutter_secure_storage: ^9.0.0
  uuid: ^4.4.0
  mixpanel_analytics: ^2.1.1
  carousel_slider: ^5.0.0
  device_info_plus: ^11.2.0
  easy_localization: ^3.0.0
  neubrutalism_ui: ^2.0.2
  # simplytranslate peut être supprimé si inutile
  path_provider: ^2.0.11
  app_links: ^6.3.3
  flutter_svg: ^2.0.9

  # flutter_map_location_marker: ^6.0.0 # ATTENTION ERROR
  # flutter_webview_plugin: ^0.4.0 # ATTENTION ERROR
  # sensors_plus: ^2.0.0 # ATTENTION ERROR

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_native_splash:
  color: "#ffffff"
  image: assets/splash.png
  ios: true
  android: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/yummap-format.png"
  web:
    generate: true
    image_path: "assets/yummap-format.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  macos:
    generate: true
    image_path: "assets/yummap-format.png"
